[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperindex"
version = "0.1.0"
description = "GPU-accelerated local semantic and code search engine"
requires-python = ">=3.12"
dependencies = [
    "onnxruntime",
    "numpy",
    "rich",
    "typer",
    "watchdog",
    "tokenizers",
    "huggingface-hub",
    "textual",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hyperindex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
